name: Refresh Salesforce Data

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 9am UTC, Mon–Fri
  workflow_dispatch:          # also lets you trigger it manually

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install composio-openai

      - name: Run refresh
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: python refresh.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --staged --quiet || git commit -m "chore: refresh salesforce data $(date -u +%Y-%m-%d)"
          git push
