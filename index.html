<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6fa; color: #1a1a2e; }
  header { background: #1a1a2e; color: #fff; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
  header span { font-size: .8rem; opacity: .55; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px 32px 0; }
  .kpi { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .kpi .label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-bottom: 6px; }
  .kpi .value { font-size: 2rem; font-weight: 700; color: #1a1a2e; }
  .kpi .sub { font-size: .8rem; color: #aaa; margin-top: 4px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 20px 32px 32px; }
  .card { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-bottom: 16px; }
  canvas { max-height: 260px; }
  .filters { display: flex; gap: 8px; padding: 16px 32px 0; flex-wrap: wrap; }
  .chip { padding: 6px 16px; border-radius: 20px; border: 1.5px solid #ddd; background: #fff; font-size: .8rem; font-weight: 600; cursor: pointer; color: #555; transition: all .15s; }
  .chip:hover { border-color: #6366f1; color: #6366f1; }
  .chip.active { background: #6366f1; border-color: #6366f1; color: #fff; }
  .progress-bar { background: #f0f0f0; border-radius: 6px; height: 8px; margin-top: 10px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 6px; background: #6366f1; transition: width .4s; }
  .progress-fill.green { background: #16a34a; }
  .kpi-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 32px 0; }
</style>
</head>
<body>
<header>
  <h1>Sales Dashboard</h1>
  <span id="generated-date"></span>
</header>

<div class="kpi-row2" id="revenue-section" style="display:none">
  <div class="kpi">
    <div class="label">Monthly Revenue</div>
    <div class="value" id="kpi-monthly-rev">—</div>
    <div class="sub" id="kpi-monthly-goal"></div>
    <div class="progress-bar"><div class="progress-fill" id="monthly-bar" style="width:0%"></div></div>
  </div>
  <div class="kpi">
    <div class="label">Annual Revenue (YTD)</div>
    <div class="value" id="kpi-annual-rev">—</div>
    <div class="sub" id="kpi-annual-goal"></div>
    <div class="progress-bar"><div class="progress-fill green" id="annual-bar" style="width:0%"></div></div>
  </div>
</div>

<div class="kpis">
  <div class="kpi">
    <div class="label">Open Pipeline Value</div>
    <div class="value" id="kpi-pipeline">—</div>
    <div class="sub" id="kpi-opps"></div>
  </div>
  <div class="kpi">
    <div class="label">YTD Meetings</div>
    <div class="value" id="kpi-meetings">—</div>
    <div class="sub" id="kpi-avg"></div>
  </div>
  <div class="kpi">
    <div class="label">New Pipeline (MTD)</div>
    <div class="value" id="kpi-mtd">—</div>
    <div class="sub" id="kpi-mtd-count"></div>
  </div>
</div>

<div class="charts">
  <div class="card">
    <h2>Pipeline Funnel</h2>
    <canvas id="stageChart"></canvas>
  </div>
  <div class="card">
    <h2>Meetings per Month</h2>
    <canvas id="meetingsChart"></canvas>
  </div>
  <div class="card">
    <h2>New Pipeline Added (MoM)</h2>
    <canvas id="growthChart"></canvas>
  </div>
</div>

<script>
let currentOwner = '';
let chartInstances = [];

async function loadDashboard(owner) {
  // Destroy existing charts
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];

  let D;
  try {
    const url = owner ? `/api/data?owner=${encodeURIComponent(owner)}` : '/api/data';
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error ' + res.status);
    D = await res.json();
    if (D.error) throw new Error(D.error);
  } catch (e) {
    document.body.innerHTML = '<p style="padding:2rem;color:red">Failed to load data: ' + e.message + '</p>';
    return;
  }

  // Header date
  document.getElementById('generated-date').textContent = 'Updated ' + D.generated;

  // KPIs
  const fmt = v => '$' + (v >= 1e6 ? (v/1e6).toFixed(1)+'M' : (v/1e3).toFixed(0)+'K');

  // Revenue KPIs
  if (D.revenue) {
    document.getElementById('revenue-section').style.display = 'grid';
    const r = D.revenue;
    document.getElementById('kpi-monthly-rev').textContent = fmt(r.currentMonthRevenue);
    document.getElementById('kpi-monthly-goal').textContent = `${r.monthlyPct}% of ${fmt(r.monthlyGoal)} goal`;
    document.getElementById('monthly-bar').style.width = Math.min(r.monthlyPct, 100) + '%';
    document.getElementById('kpi-annual-rev').textContent = fmt(r.ytdRevenue);
    document.getElementById('kpi-annual-goal').textContent = `${r.annualPct}% of ${fmt(r.annualGoal)} goal`;
    document.getElementById('annual-bar').style.width = Math.min(r.annualPct, 100) + '%';
  }
  document.getElementById('kpi-pipeline').textContent = fmt(D.summary.totalOpenPipelineValue);
  document.getElementById('kpi-opps').textContent = D.summary.totalOpenOpportunities + ' open opportunities';
  document.getElementById('kpi-meetings').textContent = D.summary.ytdMeetings;
  document.getElementById('kpi-avg').textContent = 'Avg ' + D.summary.avgMonthlyMeetings + '/mo';

  // MTD: last entry in pipelineGrowth
  const growth = D.pipelineGrowth || [];
  if (growth.length > 0) {
    const mtd = growth[growth.length - 1];
    const prev = growth[growth.length - 2];
    const momPct = prev && prev.value > 0
      ? Math.round((mtd.value - prev.value) / prev.value * 100)
      : null;
    const momStr = momPct !== null ? ` (${momPct >= 0 ? '+' : ''}${momPct}% MoM)` : '';
    document.getElementById('kpi-mtd').textContent = fmt(mtd.value);
    document.getElementById('kpi-mtd-count').textContent = mtd.count + ' new opps · ' + mtd.month + momStr;
  }

  // MoM% plugin for bar charts
  const momPlugin = {
    id: 'momLabels',
    afterDatasetsDraw(chart) {
      const { ctx, data } = chart;
      const vals = data.datasets[0].data;
      ctx.save();
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      vals.forEach((v, i) => {
        const meta = chart.getDatasetMeta(0);
        const bar = meta.data[i];
        if (i === 0) return;
        const prev = vals[i - 1];
        if (!prev || prev === 0) return;
        const pct = Math.round((v - prev) / prev * 100);
        const label = (pct >= 0 ? '+' : '') + pct + '%';
        ctx.fillStyle = pct >= 0 ? '#16a34a' : '#dc2626';
        ctx.fillText(label, bar.x, bar.y - 6);
      });
      ctx.restore();
    }
  };

  // Stage funnel (horizontal bar, centered)
  const stageData = (D.pipelineByStage || []); // Qualify → Negotiate top to bottom
  const maxVal = Math.max(...stageData.map(s => s.value));
  const offsets = stageData.map(s => (maxVal - s.value) / 2);
  const stageColors = ['#6366f1','#22d3ee','#f59e0b','#f43f5e'].slice(0, stageData.length);
  chartInstances.push(new Chart(document.getElementById('stageChart'), {
    type: 'bar',
    data: {
      labels: stageData.map(s => s.stage),
      datasets: [
        {
          data: offsets,
          backgroundColor: 'transparent',
          borderColor: 'transparent',
          borderWidth: 0,
          hoverBackgroundColor: 'transparent',
        },
        {
          data: stageData.map(s => s.value),
          backgroundColor: stageColors,
          borderRadius: 4,
          borderSkipped: false,
        }
      ]
    },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              if (ctx.datasetIndex === 0) return null;
              const d = stageData[ctx.dataIndex];
              return ` ${fmt(d.value)} · ${d.count} opps`;
            }
          },
          filter: item => item.datasetIndex === 1
        }
      },
      scales: {
        x: {
          stacked: true,
          display: false,
          grid: { display: false }
        },
        y: {
          stacked: true,
          grid: { display: false },
          ticks: { font: { size: 12 } }
        }
      }
    }
  }));

  // Meetings chart (bar)
  const mData = D.meetingsPerMonth;
  chartInstances.push(new Chart(document.getElementById('meetingsChart'), {
    type: 'bar',
    plugins: [momPlugin],
    data: {
      labels: mData.map(m => m.month),
      datasets: [{
        label: 'Meetings',
        data: mData.map(m => m.meetings),
        backgroundColor: '#6366f1',
        borderRadius: 4
      }]
    },
    options: {
      layout: { padding: { top: 24 } },
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 5 } } }
    }
  }));

  // Growth chart (bar)
  const gData = D.pipelineGrowth;
  chartInstances.push(new Chart(document.getElementById('growthChart'), {
    type: 'bar',
    plugins: [momPlugin],
    data: {
      labels: gData.map(g => g.month),
      datasets: [{
        label: 'New Pipeline Value',
        data: gData.map(g => g.value),
        backgroundColor: '#22d3ee',
        borderRadius: 4
      }]
    },
    options: {
      layout: { padding: { top: 24 } },
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: v => '$' + (v/1e3).toFixed(0)+'K' }
        }
      }
    }
  }));
}

// Wire up filter chips
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentOwner = chip.dataset.owner;
    loadDashboard(currentOwner);
  });
});

// Initial load
loadDashboard('');
</script>
</body>
</html>
