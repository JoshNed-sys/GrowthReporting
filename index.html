<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sales Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6fa; color: #1a1a2e; }
  header { background: #1a1a2e; color: #fff; padding: 18px 32px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; }
  header span { font-size: .8rem; opacity: .55; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px 32px 0; }
  .kpi { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .kpi .label { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-bottom: 6px; }
  .kpi .value { font-size: 2rem; font-weight: 700; color: #1a1a2e; }
  .kpi .sub { font-size: .8rem; color: #aaa; margin-top: 4px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; padding: 20px 32px 32px; }
  .card { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card h2 { font-size: .85rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #888; margin-bottom: 16px; }
  canvas { max-height: 260px; }
</style>
</head>
<body>
<header>
  <h1>Sales Dashboard</h1>
  <span id="generated-date"></span>
</header>

<div class="kpis">
  <div class="kpi">
    <div class="label">Open Pipeline Value</div>
    <div class="value" id="kpi-pipeline">—</div>
    <div class="sub" id="kpi-opps"></div>
  </div>
  <div class="kpi">
    <div class="label">YTD Meetings</div>
    <div class="value" id="kpi-meetings">—</div>
    <div class="sub" id="kpi-avg"></div>
  </div>
  <div class="kpi">
    <div class="label">New Pipeline (MTD)</div>
    <div class="value" id="kpi-mtd">—</div>
    <div class="sub" id="kpi-mtd-count"></div>
  </div>
</div>

<div class="charts">
  <div class="card">
    <h2>Pipeline by Stage</h2>
    <canvas id="stageChart"></canvas>
  </div>
  <div class="card">
    <h2>Meetings per Month</h2>
    <canvas id="meetingsChart"></canvas>
  </div>
  <div class="card">
    <h2>New Pipeline Added (MoM)</h2>
    <canvas id="growthChart"></canvas>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  const D = window.DASHBOARD_DATA;
  if (!D) { document.body.innerHTML = '<p style="padding:2rem;color:red">data.js not loaded</p>'; return; }

  // Header date
  document.getElementById('generated-date').textContent = 'Updated ' + D.generated;

  // KPIs
  const fmt = v => '$' + (v >= 1e6 ? (v/1e6).toFixed(1)+'M' : (v/1e3).toFixed(0)+'K');
  document.getElementById('kpi-pipeline').textContent = fmt(D.summary.totalOpenPipelineValue);
  document.getElementById('kpi-opps').textContent = D.summary.totalOpenOpportunities + ' open opportunities';
  document.getElementById('kpi-meetings').textContent = D.summary.ytdMeetings;
  document.getElementById('kpi-avg').textContent = 'Avg ' + D.summary.avgMonthlyMeetings + '/mo';

  // MTD: last entry in pipelineGrowth
 const mtd = growth[growth.length - 1];
const prev = growth[growth.length - 2];
const momPct = prev && prev.value > 0
  ? Math.round((mtd.value - prev.value) / prev.value * 100)
  : null;
const momStr = momPct !== null ? ` (${momPct >= 0 ? '+' : ''}${momPct}% MoM)` : '';
document.getElementById('kpi-mtd').textContent = fmt(mtd.value);
document.getElementById('kpi-mtd-count').textContent = mtd.count + ' new opps · ' + mtd.month + momStr;

  // MoM% plugin for bar charts
  const momPlugin = {
    id: 'momLabels',
    afterDatasetsDraw(chart) {
      const { ctx, data } = chart;
      const vals = data.datasets[0].data;
      ctx.save();
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      vals.forEach((v, i) => {
        const meta = chart.getDatasetMeta(0);
        const bar = meta.data[i];
        if (i === 0) return;
        const prev = vals[i - 1];
        if (!prev || prev === 0) return;
        const pct = Math.round((v - prev) / prev * 100);
        const label = (pct >= 0 ? '+' : '') + pct + '%';
        ctx.fillStyle = pct >= 0 ? '#16a34a' : '#dc2626';
        ctx.fillText(label, bar.x, bar.y - 6);
      });
      ctx.restore();
    }
  };

  // Stage chart (doughnut)
  const stageData = D.pipelineByStage;
  const stageColors = ['#6366f1','#22d3ee','#f59e0b','#f43f5e'];
  new Chart(document.getElementById('stageChart'), {
    type: 'doughnut',
    data: {
      labels: stageData.map(s => s.stage),
      datasets: [{
        data: stageData.map(s => s.value),
        backgroundColor: stageColors,
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const d = stageData[ctx.dataIndex];
              return ` ${d.stage}: ${fmt(d.value)} (${d.count} opps)`;
            }
          }
        }
      }
    }
  });

  // Meetings chart (bar)
  const mData = D.meetingsPerMonth;
  new Chart(document.getElementById('meetingsChart'), {
    type: 'bar',
    plugins: [momPlugin],
    data: {
      labels: mData.map(m => m.month),
      datasets: [{
        label: 'Meetings',
        data: mData.map(m => m.meetings),
        backgroundColor: '#6366f1',
        borderRadius: 4
      }]
    },
    options: {
      layout: { padding: { top: 24 } },
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 5 } } }
    }
  });

  // Growth chart (bar)
  const gData = D.pipelineGrowth;
  new Chart(document.getElementById('growthChart'), {
    type: 'bar',
    plugins: [momPlugin],
    data: {
      labels: gData.map(g => g.month),
      datasets: [{
        label: 'New Pipeline Value',
        data: gData.map(g => g.value),
        backgroundColor: '#22d3ee',
        borderRadius: 4
      }]
    },
    options: {
      layout: { padding: { top: 24 } },
      plugins: { legend: { display: false } },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: v => '$' + (v/1e3).toFixed(0)+'K' }
        }
      }
    }
  });
})();
</script>
</body>
</html>
