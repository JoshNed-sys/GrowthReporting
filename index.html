<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Sale Pipeline Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f9;
    color: #1a1a2e;
    min-height: 100vh;
  }

  header {
    background: #1a1a2e;
    color: #fff;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: 0.01em; }
  header .meta { font-size: 0.78rem; color: #a0aec0; }

  .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

  /* KPI row */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .kpi {
    background: #fff;
    border-radius: 10px;
    padding: 20px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .kpi .label {
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #718096;
    margin-bottom: 8px;
  }
  .kpi .value {
    font-size: 1.9rem;
    font-weight: 700;
    color: #1a1a2e;
    line-height: 1;
  }
  .kpi .sub {
    font-size: 0.75rem;
    color: #a0aec0;
    margin-top: 4px;
  }

  /* Chart grid */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .chart-card {
    background: #fff;
    border-radius: 10px;
    padding: 22px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-card h2 {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #718096;
    margin-bottom: 18px;
  }
  .chart-wrap { position: relative; height: 240px; }
  .chart-card.full .chart-wrap { height: 220px; }

  /* Stage table */
  .table-card {
    background: #fff;
    border-radius: 10px;
    padding: 22px 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    margin-bottom: 20px;
  }
  .table-card h2 {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #718096;
    margin-bottom: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead th {
    text-align: left;
    padding: 8px 12px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #a0aec0;
    border-bottom: 1px solid #e2e8f0;
  }
  thead th:not(:first-child) { text-align: right; }
  tbody tr:hover { background: #f7fafc; }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f4f8;
    color: #2d3748;
  }
  tbody td:not(:first-child) { text-align: right; }
  .stage-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
  tfoot td {
    padding: 10px 12px;
    font-weight: 600;
    color: #1a1a2e;
    border-top: 2px solid #e2e8f0;
    font-size: 0.875rem;
  }
  tfoot td:not(:first-child) { text-align: right; }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: #a0aec0;
    padding: 20px 0 32px;
  }

  @media (max-width: 680px) {
    .charts-grid { grid-template-columns: 1fr; }
    .chart-card.full { grid-column: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>Pre-Sale Pipeline Dashboard</h1>
  <span class="meta" id="hdr-meta">Loading…</span>
</header>

<div class="container">
  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi">
      <div class="label">Open Pipeline</div>
      <div class="value" id="kpi-pipeline">—</div>
      <div class="sub" id="kpi-pipeline-sub"></div>
    </div>
    <div class="kpi">
      <div class="label">Open Deals</div>
      <div class="value" id="kpi-deals">—</div>
      <div class="sub">active opportunities</div>
    </div>
    <div class="kpi">
      <div class="label">YTD Meetings</div>
      <div class="value" id="kpi-meetings">—</div>
      <div class="sub" id="kpi-meetings-sub"></div>
    </div>
  </div>

  <!-- Charts row -->
  <div class="charts-grid">
    <div class="chart-card">
      <h2>Meetings / Month</h2>
      <div class="chart-wrap"><canvas id="meetingsChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h2>Pipeline by Stage</h2>
      <div class="chart-wrap"><canvas id="stageChart"></canvas></div>
    </div>
    <div class="chart-card full">
      <h2>New Pipeline Created per Month</h2>
      <div class="chart-wrap"><canvas id="growthChart"></canvas></div>
    </div>
  </div>

  <!-- Stage table -->
  <div class="table-card">
    <h2>Stage Breakdown</h2>
    <table>
      <thead>
        <tr>
          <th>Stage</th>
          <th>Deals</th>
          <th>Pipeline Value</th>
          <th>Avg Deal Size</th>
        </tr>
      </thead>
      <tbody id="stage-tbody"></tbody>
      <tfoot id="stage-tfoot"></tfoot>
    </table>
  </div>
</div>

<footer id="footer">—</footer>

<script src="data.js"></script>
<script>
(function () {
  const D = window.DASHBOARD_DATA;
  if (!D) { document.body.innerHTML = '<p style="padding:40px;color:red">data.js not loaded.</p>'; return; }

  const S = D.summary;
  const fmt$ = v => '$' + (v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(0)+'K' : v.toLocaleString());
  const fmtFull$ = v => '$' + Math.round(v).toLocaleString();

  // Header
  document.getElementById('hdr-meta').textContent =
    `FY${D.fiscalYear} · Updated ${D.generated}`;

  // KPIs
  document.getElementById('kpi-pipeline').textContent = fmt$(S.totalOpenPipelineValue);
  document.getElementById('kpi-pipeline-sub').textContent = fmtFull$(S.totalOpenPipelineValue);
  document.getElementById('kpi-deals').textContent = S.totalOpenOpportunities.toLocaleString();
  document.getElementById('kpi-meetings').textContent = S.ytdMeetings.toLocaleString();
  document.getElementById('kpi-meetings-sub').textContent = `${S.avgMonthlyMeetings} avg / month`;

  // ── Palette ────────────────────────────────────────────────────────────
  const STAGE_COLORS = [
    '#4361ee','#3a0ca3','#7209b7','#f72585','#e85d04','#48cae4'
  ];

  // ── Meetings bar ───────────────────────────────────────────────────────
  const mData = D.meetingsPerMonth;
  new Chart(document.getElementById('meetingsChart'), {
    type: 'bar',
    data: {
      labels: mData.map(d => d.month),
      datasets: [{
        label: 'Meetings',
        data: mData.map(d => d.meetings),
        backgroundColor: '#4361ee',
        borderRadius: 4,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 11 } }, grid: { color: '#f0f4f8' } }
      }
    }
  });

  // ── Pipeline donut ─────────────────────────────────────────────────────
  const pData = D.pipelineByStage;
  new Chart(document.getElementById('stageChart'), {
    type: 'doughnut',
    data: {
      labels: pData.map(d => d.stage),
      datasets: [{
        data: pData.map(d => d.value),
        backgroundColor: STAGE_COLORS.slice(0, pData.length),
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: {
          position: 'right',
          labels: { font: { size: 11 }, padding: 12, boxWidth: 12 }
        },
        tooltip: {
          callbacks: {
            label: ctx => ` ${fmtFull$(ctx.raw)}  (${ctx.label})`
          }
        }
      }
    }
  });

  // ── Growth combo ───────────────────────────────────────────────────────
  const gData = D.pipelineGrowth;
  new Chart(document.getElementById('growthChart'), {
    type: 'bar',
    data: {
      labels: gData.map(d => d.month),
      datasets: [
        {
          type: 'bar',
          label: 'New Deals',
          data: gData.map(d => d.count),
          backgroundColor: '#4361ee',
          borderRadius: 4,
          yAxisID: 'yCount'
        },
        {
          type: 'line',
          label: 'New Value',
          data: gData.map(d => d.value),
          borderColor: '#f72585',
          backgroundColor: 'rgba(247,37,133,0.08)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          yAxisID: 'yValue'
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index' },
      plugins: {
        legend: { labels: { font: { size: 11 }, boxWidth: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => ctx.dataset.yAxisID === 'yValue'
              ? ` ${ctx.dataset.label}: ${fmtFull$(ctx.raw)}`
              : ` ${ctx.dataset.label}: ${ctx.raw}`
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 } } },
        yCount: {
          position: 'left',
          beginAtZero: true,
          ticks: { precision: 0, font: { size: 11 } },
          grid: { color: '#f0f4f8' },
          title: { display: true, text: 'Deals', font: { size: 10 }, color: '#718096' }
        },
        yValue: {
          position: 'right',
          beginAtZero: true,
          grid: { display: false },
          ticks: {
            font: { size: 11 },
            callback: v => v >= 1e6 ? '$'+(v/1e6).toFixed(1)+'M' : v >= 1e3 ? '$'+(v/1e3).toFixed(0)+'K' : '$'+v
          },
          title: { display: true, text: 'Value', font: { size: 10 }, color: '#718096' }
        }
      }
    }
  });

  // ── Stage table ────────────────────────────────────────────────────────
  const tbody = document.getElementById('stage-tbody');
  let totalVal = 0, totalCount = 0;
  pData.forEach((d, i) => {
    totalVal += d.value; totalCount += d.count;
    const avg = d.count ? Math.round(d.value / d.count) : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="stage-dot" style="background:${STAGE_COLORS[i % STAGE_COLORS.length]}"></span>${d.stage}</td>
      <td>${d.count}</td>
      <td>${fmtFull$(d.value)}</td>
      <td>${fmtFull$(avg)}</td>
    `;
    tbody.appendChild(tr);
  });
  const tfoot = document.getElementById('stage-tfoot');
  const totalAvg = totalCount ? Math.round(totalVal / totalCount) : 0;
  tfoot.innerHTML = `
    <tr>
      <td>Total</td>
      <td>${totalCount}</td>
      <td>${fmtFull$(totalVal)}</td>
      <td>${fmtFull$(totalAvg)}</td>
    </tr>
  `;

  // Footer
  document.getElementById('footer').textContent =
    `Data source: Salesforce · Pipeline stages: Qualify, Explore, Propose, Negotiate, Nurture · FY${D.fiscalYear}`;
})();
</script>
</body>
</html>
